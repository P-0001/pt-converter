# CI for pt-converter: runs unit tests on every push/PR, builds the
# pt-converter.exe artifact on master pushes and tags, and publishes tag
# builds to GitHub Releases. The PyInstaller bundle pulls in ~500 MB of
# torch wheels and takes 10+ minutes, so it is gated off PR branches.
#
# Requires PowerShell 7+ (pwsh) - preinstalled on windows-latest runners.

name: CI

on:
  push:
    branches: [master]
    tags: ["v*", "[0-9]*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest tests -v

  build:
    name: Build exe
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build (sync + test + PyInstaller)
        run: pwsh -ExecutionPolicy Bypass -File scripts\build.ps1

      - name: Compute SHA-256
        id: sha
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'dist\pt-converter.exe' -Algorithm SHA256).Hash.ToLower()
          $size = [math]::Round((Get-Item 'dist\pt-converter.exe').Length / 1MB, 1)
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "size_mb=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "$hash *pt-converter.exe" | Out-File -FilePath 'dist\pt-converter.exe.sha256' -NoNewline
          Write-Host "SHA-256: $hash"
          Write-Host "Size: $size MB"
          "| Field | Value |`n|---|---|`n| SHA-256 | \`$hash\` |`n| Size | $size MB |" `
            | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pt-converter-windows-x64
          path: |
            dist/pt-converter.exe
            dist/pt-converter.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            'dist\pt-converter.exe'
            'dist\pt-converter.exe.sha256'
          )

          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --verify-tag --generate-notes --title $tag
          }
