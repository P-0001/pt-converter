# CI for pt-converter: runs unit tests on every push/PR (Windows x64, Linux
# x64, macOS arm64), builds one PyInstaller binary per platform on tag pushes,
# and publishes all of them to a single GitHub Release. The PyInstaller bundle
# pulls in ~500 MB of torch wheels and takes 10+ minutes, so builds are gated
# to tags only.
#
# Release assets:
#   pt-converter.exe          (+ .sha256)  Windows x64
#   pt-converter-linux-x64    (+ .sha256)  Linux x64 (manylinux_2_28 container, glibc 2.28+)
#   pt-converter-macos-arm64  (+ .sha256)  macOS arm64 (macos-latest runner)
#
# Windows builds use PowerShell 7+ (pwsh), preinstalled on windows-latest.
# Linux/macOS builds use scripts/build.sh (bash).
#
# The Linux binary is built inside the manylinux_2_28 container, not on the
# ubuntu-latest host. PyInstaller bundles shared libraries from the build
# machine (libglib-2.0 and friends), so a binary built on a new Ubuntu needs
# that Ubuntu's glibc at runtime and fails on older distros with
# "version `GLIBC_2.xx' not found". Building on glibc 2.28 runs on any distro
# with glibc 2.28 or later.

name: CI

on:
  push:
    branches: [master]
    tags: ["v*", "[0-9]*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest tests -v

  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    # Empty for Windows and macOS, so those jobs run on the runner host.
    container: ${{ matrix.container }}
    env:
      # manylinux ships static CPython builds without libpython, which
      # PyInstaller needs. uv-managed Python includes it. Windows and macOS
      # use "managed", uv's default, so their builds are unchanged.
      UV_PYTHON_PREFERENCE: ${{ matrix.uv_python_preference }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            container: ""
            uv_python_preference: managed
            binary: dist/pt-converter.exe
            asset: pt-converter.exe
            artifact: pt-converter-windows-x64
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            uv_python_preference: only-managed
            binary: dist/pt-converter
            asset: pt-converter-linux-x64
            artifact: pt-converter-linux-x64
          - os: macos-latest
            container: ""
            uv_python_preference: managed
            binary: dist/pt-converter
            asset: pt-converter-macos-arm64
            artifact: pt-converter-macos-arm64
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build (sync + test + PyInstaller)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File scripts\build.ps1

      - name: Build (sync + test + PyInstaller)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build.sh

      - name: Compute SHA-256
        if: runner.os == 'Windows'
        id: sha
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'dist\pt-converter.exe' -Algorithm SHA256).Hash.ToLower()
          $size = [math]::Round((Get-Item 'dist\pt-converter.exe').Length / 1MB, 1)
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "size_mb=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "$hash *pt-converter.exe" | Out-File -FilePath 'dist\pt-converter.exe.sha256' -NoNewline
          Write-Host "SHA-256: $hash"
          Write-Host "Size: $size MB"
          "| Field | Value |`n|---|---|`n| SHA-256 | ``$hash`` |`n| Size | $size MB |" `
            | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Compute SHA-256 (POSIX)
        if: runner.os != 'Windows'
        id: sha_posix
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          cp "$BINARY" "dist/$ASSET"
          if command -v sha256sum >/dev/null 2>&1; then
            hash="$(sha256sum "dist/$ASSET" | awk '{print tolower($1)}')"
          else
            hash="$(shasum -a 256 "dist/$ASSET" | awk '{print tolower($1)}')"
          fi
          bytes="$(wc -c < "dist/$ASSET" | tr -d '[:space:]')"
          size="$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1048576 }')"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "size_mb=$size" >> "$GITHUB_OUTPUT"
          printf '%s *%s' "$hash" "$ASSET" > "dist/$ASSET.sha256"
          echo "SHA-256: $hash"
          echo "Size: $size MB"
          printf '| Field | Value |\n|---|---|\n| SHA-256 | `%s` |\n| Size | %s MB |\n' "$hash" "$size" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pt-converter-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          assets=(
            release-assets/pt-converter.exe
            release-assets/pt-converter.exe.sha256
            release-assets/pt-converter-linux-x64
            release-assets/pt-converter-linux-x64.sha256
            release-assets/pt-converter-macos-arm64
            release-assets/pt-converter-macos-arm64.sha256
          )
          ls -l release-assets

          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --generate-notes --title "$tag"
          fi
